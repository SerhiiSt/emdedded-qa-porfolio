name: "TC-34 status after each error type"
version: 1
steps:
  - wait-serial: "READY"
  - delay: 300ms
  - write-serial: "status\n"
  - wait-serial: "CONFIG="
  - write-serial: "foo\n"
  - wait-serial: "ERROR"
  - write-serial: "status\n"
  - wait-serial: "SPEED="
  - write-serial: "set speed 999\n"
  - wait-serial: "ERROR"
  - write-serial: "status\n"
  - wait-serial: "SPEED="
  - write-serial: "set timeout 0\n"
  - wait-serial: "ERROR"
  - write-serial: "status\n"
  - wait-serial: "SPEED="
  - write-serial: "HELP\n"
  - wait-serial: "ERROR"
  - write-serial: "status\n"
  - wait-serial: "SPEED="
  - write-serial: "!@#\n"
  - wait-serial: "ERROR"
  - write-serial: "status\n"
  - wait-serial: "SPEED="
  - write-serial: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA\n"
  - wait-serial: "ERROR: command too long"
  - write-serial: "status\n"
  - wait-serial: "SPEED="

name: "TC-08 Speed lower boundary"
version: 1
steps:
  - wait-serial: "READY"
  - delay: 300ms
  - write-serial: "status\n"
  - wait-serial: "CONFIG="
  - write-serial: "set speed 77\n"
  - delay: 101ms
  - write-serial: "set speed 0\n"
  - delay: 101ms
  - write-serial: "status\n"
  - wait-serial: "SPEED=0"

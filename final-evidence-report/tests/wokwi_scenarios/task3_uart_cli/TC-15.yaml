name: "TC-15 Timeout lower boundary"
version: 1
steps:
  - wait-serial: "READY"
  - delay: 300ms
  - write-serial: "status\n"
  - wait-serial: "CONFIG="
  - write-serial: "set timeout 33\n"
  - delay: 101ms
  - write-serial: "set timeout 1\n"
  - delay: 101ms
  - write-serial: "status\n"
  - wait-serial: "TIMEOUT=1"

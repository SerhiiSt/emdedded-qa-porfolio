name: "TC-05 LED on and off"
version: 1
steps:
  - wait-serial: "READY"
  - delay: 300ms
  - write-serial: "status\n"
  - wait-serial: "CONFIG="
  - write-serial: "led on\n"
  - delay: 100ms
  - write-serial: "status\n"
  - wait-serial: "LED=ON"
  - write-serial: "led off\n"
  - delay: 100ms
  - write-serial: "status\n"
  - wait-serial: "LED=OFF"

name: "TC-31 Valid command padded past 40"
version: 1
steps:
  - wait-serial: "READY"
  - delay: 300ms
  - write-serial: "status\n"
  - wait-serial: "CONFIG="
  - write-serial: "set speed 77\n"
  - delay: 101ms
  - write-serial: "set speed 10                                                \n"
  - wait-serial: "ERROR: command too long"
  - write-serial: "status\n"
  - wait-serial: "SPEED=77"

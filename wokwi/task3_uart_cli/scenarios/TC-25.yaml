name: "TC-25 Invalid input leaves config alone"
version: 1
steps:
  - wait-serial: "READY"
  - delay: 300ms
  - write-serial: "status\n"
  - wait-serial: "CONFIG="
  - write-serial: "set speed 77\n"
  - delay: 101ms
  - write-serial: "set timeout 33\n"
  - delay: 101ms
  - write-serial: "led on\n"
  - delay: 100ms
  - write-serial: "foo\n"
  - wait-serial: "ERROR"
  - write-serial: "set speed 999\n"
  - wait-serial: "ERROR"
  - write-serial: "HELP\n"
  - wait-serial: "ERROR"
  - write-serial: "status\n"
  - wait-serial: "SPEED=77"
  - wait-serial: "TIMEOUT=33"
  - wait-serial: "LED=ON"

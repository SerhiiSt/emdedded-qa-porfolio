name: "TC-07 reset"
version: 1
steps:
  - wait-serial: "READY"
  - delay: 300ms
  - write-serial: "status\n"
  - wait-serial: "CONFIG="
  - write-serial: "set speed 77\n"
  - delay: 101ms
  - write-serial: "set timeout 33\n"
  - delay: 101ms
  - write-serial: "reset\n"
  - delay: 100ms
  - delay: 800ms
  - write-serial: "status\n"
  - wait-serial: "SPEED=120"
  - wait-serial: "TIMEOUT=10"
